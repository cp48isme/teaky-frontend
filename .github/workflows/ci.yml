name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # alert() is banned (30 Oct 2026). This runs only the ban rules, so the
      # gate holds whatever else the full lint has outstanding.
      - name: Banned calls
        run: npm run lint:banned

      - name: Build
        run: npm run build
