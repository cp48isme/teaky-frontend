name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base: a PR stacked on another branch
  # (30 Oct 2026, Causes 3/4/6/8 on the status seam) was getting no checks.
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # alert() is banned (30 Oct 2026). This runs only the ban rules, so the
      # gate holds whatever else the full lint has outstanding.
      - name: Banned calls
        run: npm run lint:banned

      # Ruling 18 Nov 2026 evening: a red test blocks a frontend merge the
      # way it does on the backend. This step lives in the one required
      # check (lint-and-build), so the ruleset needs no change.
      - name: Test
        run: npx vitest run

      # Dispatch 23 Nov 2026 (item 6): the generated API types against the
      # backend's openapi.json on main. Gated on the read token: until Clayton
      # creates PRINTER_AGENT2_READ_TOKEN (read access to TeakyDev/printer-agent2)
      # the step says so and passes; with it, drift fails the check.
      - name: API types drift
        env:
          OPENAPI_TOKEN: ${{ secrets.PRINTER_AGENT2_READ_TOKEN }}
        run: |
          if [ -z "$OPENAPI_TOKEN" ]; then
            echo "PRINTER_AGENT2_READ_TOKEN is not set; the API types drift check is skipped (it passes) until it is."
            exit 0
          fi
          npm run types:api:check -- "https://api.github.com/repos/TeakyDev/printer-agent2/contents/openapi.json?ref=main"
      # Dispatch 23 Nov 2026 (item 7): npm audit as a ratchet against the
      # committed baseline — nothing fails today, anything new fails tomorrow.
      - name: npm audit ratchet
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node scripts/npm-audit-ratchet.mjs check /tmp/npm-audit.json

      - name: Build
        run: npm run build
